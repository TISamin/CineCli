name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Don't run duplicate builds for dependent PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write  # for ghcr.io push on master

jobs:
  # ----- 1. Maven unit + integration tests -----
  test:
    name: Tests (mvn)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinemaseat
          POSTGRES_USER: cinemaseat
          POSTGRES_PASSWORD: cinemaseat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinemaseat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Run tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cinemaseat
          SPRING_DATASOURCE_USERNAME: cinemaseat
          SPRING_DATASOURCE_PASSWORD: cinemaseat
        run: mvn -B -ntp test

      - name: Build jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cinemaseat-backend
          path: backend/target/cinemaseat-backend-*.jar
          if-no-files-found: error

  # ----- 2. End-to-end stack + Scenario A keystone via k6 -----
  keystone:
    name: "Keystone (Scenario A: 1/99/0)"
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinemaseat
          POSTGRES_USER: cinemaseat
          POSTGRES_PASSWORD: cinemaseat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinemaseat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      gateway:
        image: asifmahmoud414/mock-gateway:latest
        ports: ["9000:9000"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Start api
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cinemaseat
          SPRING_DATASOURCE_USERNAME: cinemaseat
          SPRING_DATASOURCE_PASSWORD: cinemaseat
          GATEWAY_URL: http://localhost:9000
          GATEWAY_CALLBACK_URL: http://localhost:8080/api/payments/callback
          OTP_CALLBACK_URL: http://localhost:8080/api/otp/callback
          GATEWAY_SECRET: z2p-2026-secret
        run: |
          # Stream app logs to a file so we can dump on failure.
          nohup java -jar target/cinemaseat-backend-*.jar > app.log 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID"
          # Wait up to 120s for the app to become ready.
          READY=false
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready > /dev/null 2>&1; then
              echo "App is ready after ${i} attempts"
              READY=true
              break
            fi
            sleep 2
          done
          if [ "$READY" != "true" ]; then
            echo "App failed to become ready within 120s. Last 100 lines of app.log:"
            tail -n 100 app.log
            kill $APP_PID || true
            exit 1
          fi

      - name: Run Scenario A keystone (k6)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/scenario-a.js
          flags: -e BASE_URL=http://localhost:8080

      - name: Cleanup
        if: always()
        run: |
          pkill -f cinemaseat-backend || true
          true

  # ----- 3. Docker build verification -----
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: cinemaseat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----- 4. Push image to GHCR on master -----
  publish:
    name: Publish image (ghcr.io)
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cinemaseat:latest
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
